<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎃 Halloween Set Expressions: a / an / the / —</title>
<style>
  * { box-sizing: border-box; }

  body {
    font-family: 'Trebuchet MS', 'Segoe UI', Roboto, Arial, sans-serif;
    background:
      radial-gradient(circle at 15% 10%, rgba(255,140,0,.18), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(138,43,226,.22), transparent 45%),
      #0d0a14;
    margin: 0;
    padding: 24px;
    color: #f3e9ff;
    min-height: 100vh;
  }

  .bg-decor {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
  }
  .bg-decor span {
    position: absolute;
    opacity: .12;
    font-size: 42px;
    animation: float 9s ease-in-out infinite;
  }
  .bg-decor span:nth-child(1) { top: 8%;  left: 6%;  animation-delay: 0s; }
  .bg-decor span:nth-child(2) { top: 20%; right: 8%; animation-delay: 1.4s; font-size: 56px; }
  .bg-decor span:nth-child(3) { bottom: 12%; left: 12%; animation-delay: 2.6s; }
  .bg-decor span:nth-child(4) { bottom: 22%; right: 14%; animation-delay: .7s; font-size: 34px; }
  .bg-decor span:nth-child(5) { top: 46%; left: 3%;  animation-delay: 3.1s; font-size: 30px; }
  .bg-decor span:nth-child(6) { top: 60%; right: 4%;  animation-delay: 1.9s; font-size: 48px; }

  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(-4deg); }
    50%      { transform: translateY(-18px) rotate(4deg); }
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 820px;
    margin: 0 auto;
    background: linear-gradient(180deg, #1a1226 0%, #150f1f 100%);
    padding: 30px 34px 38px;
    border-radius: 16px;
    border: 1px solid rgba(255,140,0,.35);
    box-shadow:
      0 0 0 1px rgba(138,43,226,.25),
      0 10px 40px rgba(0,0,0,.6),
      0 0 60px rgba(255,140,0,.08);
  }

  h1 {
    font-size: 24px;
    margin: 0 0 6px;
    color: #ff9e2c;
    text-shadow: 0 0 14px rgba(255,140,0,.55);
    letter-spacing: .5px;
  }

  p.hint {
    color: #b9a8cc;
    font-size: 14px;
    margin: 0 0 18px;
    line-height: 1.5;
  }

  .item {
    margin: 10px 0;
    padding: 10px 12px;
    border-radius: 10px;
    background: rgba(255,255,255,.02);
    border: 1px solid rgba(138,43,226,.15);
    transition: background .2s, border-color .2s;
  }
  .item:hover { background: rgba(255,140,0,.05); border-color: rgba(255,140,0,.3); }

  .sentence {
    font-size: 15px;
    line-height: 1.9;
    margin-bottom: 8px;
  }
  .num {
    display: inline-block;
    min-width: 26px;
    color: #ffb84d;
    font-weight: 700;
  }

  .answer-row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    padding-left: 26px;
  }

  select {
    padding: 8px 12px;
    border: 1.5px solid #4a3a63;
    border-radius: 9px;
    font-size: 15px;
    outline: none;
    background: #0f0a17;
    color: #f3e9ff;
    cursor: pointer;
    min-width: 110px;
    transition: border-color .15s, box-shadow .15s, background .15s;
  }
  select:focus {
    border-color: #ff9e2c;
    box-shadow: 0 0 0 3px rgba(255,140,0,.18);
  }
  select.correct {
    border-color: #4cd964;
    background: rgba(76,217,100,.10);
    box-shadow: 0 0 10px rgba(76,217,100,.25);
  }
  select.wrong {
    border-color: #ff3b30;
    background: rgba(255,59,48,.12);
    box-shadow: 0 0 10px rgba(255,59,48,.3);
    animation: shake .3s;
  }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25%     { transform: translateX(-4px); }
    75%     { transform: translateX(4px); }
  }

  .mark { font-weight: 700; font-size: 17px; width: 20px; }
  .mark.ok  { color: #4cd964; text-shadow: 0 0 8px rgba(76,217,100,.7); }
  .mark.bad { color: #ff3b30; text-shadow: 0 0 8px rgba(255,59,48,.7); }

  .buttons {
    margin-top: 28px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  button {
    padding: 12px 24px;
    font-size: 15px;
    font-weight: 700;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    letter-spacing: .4px;
    transition: transform .06s, box-shadow .2s, filter .2s;
  }
  button:active { transform: scale(.97); }

  #checkBtn {
    background: linear-gradient(180deg, #ff9e2c, #e67300);
    color: #1a0f00;
    box-shadow: 0 0 18px rgba(255,140,0,.5);
  }
  #checkBtn:hover { filter: brightness(1.1); box-shadow: 0 0 26px rgba(255,140,0,.75); }

  #resetBtn {
    background: linear-gradient(180deg, #7b4fbf, #5a2e9e);
    color: #f3e9ff;
    box-shadow: 0 0 16px rgba(138,43,226,.45);
  }
  #resetBtn:hover { filter: brightness(1.12); box-shadow: 0 0 24px rgba(138,43,226,.7); }

  #result {
    margin-top: 22px;
    font-size: 17px;
    font-weight: 700;
    text-align: center;
    padding: 16px;
    border-radius: 12px;
    display: none;
  }
  #result.pass {
    background: rgba(76,217,100,.12);
    color: #7dff9a;
    border: 1px solid rgba(76,217,100,.4);
    box-shadow: 0 0 22px rgba(76,217,100,.25);
  }
  #result.fail {
    background: rgba(255,59,48,.12);
    color: #ff8a80;
    border: 1px solid rgba(255,59,48,.4);
    box-shadow: 0 0 22px rgba(255,59,48,.25);
  }

  .web {
    position: absolute;
    top: -1px; right: -1px;
    width: 130px; height: 130px;
    opacity: .18;
    pointer-events: none;
  }
</style>
</head>
<body>

<div class="bg-decor">
  <span>🦇</span>
  <span>🎃</span>
  <span>🕸️</span>
  <span>👻</span>
  <span>🦇</span>
  <span>🎃</span>
</div>

<div class="container">
  <svg class="web" viewBox="0 0 100 100" fill="none" stroke="#d9b3ff" stroke-width="1">
    <path d="M100 0 L100 40 M100 0 L60 0 M100 0 L70 30 M100 0 L40 60 M100 0 L20 80"/>
    <path d="M100 15 Q85 15 80 30 M100 30 Q80 28 72 45 M100 45 Q75 42 60 62"/>
  </svg>

  <h1>🎃 Set Expressions: a / an / the / — 🎃</h1>
  <p class="hint">Выберите правильный артикль для каждого устойчивого выражения. <b>Тест сдан, если ошибок не больше 3</b>. Неправильные ответы загорятся зловещим красным. 👻</p>

  <div id="test"></div>

  <div class="buttons">
    <button id="checkBtn">🕸️ Проверить</button>
    <button id="resetBtn">💀 Сбросить</button>
  </div>
  <div id="result"></div>
</div>

<script>
/* ---------- ДАННЫЕ: 50 ВОПРОСОВ ---------- */
const questions = [
  // A/AN
  { s: "She is ___ only child in the family.", a: "an" },
  { s: "___ rule, I don't eat fast food.", a: "As a" }, // Обратите внимание: тут "As a rule", в тесте просто a, но фраза в контексте. Сделаем проще.
  
  // Переделаем формат, чтобы вставлять именно артикль в пропуск.
  // Для фраз типа "as a rule", лучше давать пропуск: "As ___ rule..."
  
  { s: "As ___ rule, I don't eat fast food.", a: "a" },
  { s: "As ___ result, we missed the train.", a: "a" },
  { s: "Let's sit here for ___ while.", a: "a" },
  { s: "I haven't seen him for ___ long time.", a: "a" },
  { s: "She is in ___ hurry to catch the bus.", a: "a" },
  { s: "We go to the cinema once ___ month.", a: "a" },
  { s: "It's ___ pleasure to meet you.", a: "a" },
  { s: "It's ___ pity you can't come.", a: "a" },
  { s: "The film turned out to be ___ success.", a: "a" },
  { s: "Could you do me ___ favour?", a: "a" },
  { s: "Can you give me ___ hand with these boxes?", a: "a" },
  { s: "Let's go for ___ walk in the park.", a: "a" },
  { s: "I need to have ___ shower before dinner.", a: "a" },
  { s: "She has ___ cold and can't stop sneezing.", a: "a" },
  { s: "He has ___ terrible headache.", a: "a" },
  { s: "Let me have ___ look at your new phone.", a: "a" },
  { s: "You need to have ___ rest after such a long day.", a: "a" },
  { s: "We had ___ good time at the party.", a: "a" },
  { s: "Don't tell ___ lie to your parents.", a: "a" },

  // THE
  { s: "It's all ___ same to me.", a: "the" },
  { s: "We spent our holiday at ___ seaside.", a: "the" },
  { s: "I need to go to ___ doctor's.", a: "the" },
  { s: "___ the way, have you seen my keys?", a: "By" }, // Снова "By the way". Лучше: "___ way, have you seen my keys?" -> By the way. 
  
  // Сделаем единый формат пропуска:
  { s: "___ the way, have you seen my keys?", a: "By" }, // не подходит под a/an/the. 
  
  // Переделаем все предложения так, чтобы пропуск был ТОЛЬКО под артикль.
  // Убираем предлоги из пропуска.
  
  { s: "I usually read in ___ evening.", a: "the" },
  { s: "They live in ___ country, far from the city.", a: "the" },
  { s: "In ___ past, people didn't have smartphones.", a: "the" },
  { s: "In ___ distance, I saw a light.", a: "the" },
  { s: "There is a lot of noise in ___ street.", a: "the" },
  { s: "___ whole, the project was a success.", a: "On the" }, // Опять "On the whole". 
  
  // Нужно строго a/an/the/— в пропуске. 
  // Переформулируем: "___ whole, the project was a success." -> "On the whole" не влезает. 
  // Сделаем пропуск только для артикля: "On ___ whole, the project was a success." -> the.
  
  { s: "On ___ whole, the project was a success.", a: "the" },
  { s: "Going there alone is out of ___ question.", a: "the" },
  { s: "On ___ one hand, it's cheap; on the other hand, it's low quality.", a: "the" },
  { s: "The shop is on ___ right.", a: "the" },
  { s: "I met him ___ other day.", a: "the" },
  { s: "We'll do it ___ day after tomorrow.", a: "the" },
  { s: "It happened ___ day before yesterday.", a: "the" },
  { s: "This is ___ only place where you can buy it.", a: "the" },
  { s: "I have ___ same opinion as you.", a: "the" },
  { s: "Go to ___ right at the traffic lights.", a: "the" },
  { s: "___ more you read, the better you write.", a: "The" }, // Нужно с заглавной? В тесте лучше строчные, но тут начало предложения. Пусть будет "The" (с большой).
  { s: "I feel under ___ weather today.", a: "the" },
  { s: "It's my turn to do ___ dishes.", a: "the" },
  { s: "We went to ___ theatre last night.", a: "the" },
  { s: "Can you lay ___ table, please?", a: "the" },
  { s: "She likes to listen to ___ radio.", a: "the" },
  { s: "Don't forget to make ___ bed.", a: "the" },
  { s: "We played ___ piano for hours.", a: "the" },
  { s: "He always tells ___ truth.", a: "the" },
  { s: "They managed to weather ___ storm.", a: "the" },

  // НУЛЕВОЙ (—)
  { s: "I have ___ breakfast at 8 a.m.", a: "—" },
  { s: "He is at ___ home now.", a: "—" },
  { s: "Children should go to ___ school every day.", a: "—" },
  { s: "I couldn't sleep at ___ night.", a: "—" },
  { s: "She is at ___ present in London.", a: "—" },
  { s: "We met by ___ accident.", a: "—" },
  { s: "I know the poem by ___ heart.", a: "—" },
  { s: "Send it by ___ email, please.", a: "—" },
  { s: "I did it by ___ mistake.", a: "—" },
  { s: "We go to school day after ___ day.", a: "—" },
  { s: "He did it for ___ fun.", a: "—" },
  { s: "We need to discuss it in ___ detail.", a: "—" },
  { s: "I am in ___ trouble.", a: "—" },
  { s: "They are in ___ love.", a: "—" },
  { s: "I am in ___ town for a few days.", a: "—" },
  { s: "We arrived just in ___ time.", a: "—" },
  { s: "He is here on ___ business.", a: "—" },
  { s: "We went there on ___ foot.", a: "—" },
  { s: "The house is on ___ fire!", a: "—" },
  { s: "I am on ___ holiday next week.", a: "—" },
  { s: "These shoes are on ___ sale.", a: "—" },
  { s: "Please be on ___ time.", a: "—" },
  { s: "He is in ___ bed with a cold.", a: "—" },
  { s: "She is in ___ hospital.", a: "—" },
  { s: "He was sent to ___ prison.", a: "—" },
  { s: "You should bear in ___ mind that it's dangerous.", a: "—" },
  { s: "They do ___ research in this lab.", a: "—" },
  { s: "We had ___ lunch at noon.", a: "—" },
  { s: "We had ___ great fun at the party.", a: "—" },
  { s: "I have ___ toothache.", a: "—" },
  { s: "We travel by ___ bus.", a: "—" },
  { s: "They went by ___ water.", a: "—" },
  { s: "He went to ___ sea at 18.", a: "—" },
  { s: "It's time to go to ___ bed.", a: "—" },
  { s: "We went to ___ town yesterday.", a: "—" },
  { s: "She keeps ___ house for her family.", a: "—" },
  { s: "He left ___ school last year.", a: "—" },
  { s: "We need to make ___ use of this opportunity.", a: "—" },
  { s: "It's easy to make ___ friends there.", a: "—" },
  { s: "Please pay ___ attention to the details.", a: "—" },
  { s: "They play ___ chess every evening.", a: "—" },
  { s: "She speaks ___ English fluently.", a: "—" },
  { s: "He studies ___ mathematics at university.", a: "—" },
  { s: "Take ___ care of yourself.", a: "—" },
  { s: "We took ___ part in the competition.", a: "—" },
  { s: "The meeting will take ___ place tomorrow.", a: "—" },
  { s: "Don't tell ___ lies.", a: "—" },
  { s: "We watched ___ television all evening.", a: "—" }
];

/* ---------- НАСТРОЙКА ---------- */
const MAX_MISTAKES = 3;

/* ---------- РЕНДЕР ---------- */
const testContainer = document.getElementById('test');
const options = ["—", "a", "an", "the"];

questions.forEach((q, i) => {
  const div = document.createElement('div');
  div.className = 'item';
  div.innerHTML = `
    <div class="sentence">
      <span class="num">${i + 1}.</span> ${q.s}
    </div>
    <div class="answer-row">
      <select id="q${i}" data-answer="${q.a}">
        <option value="" disabled selected>— выберите —</option>
        ${options.map(o => `<option value="${o}">${o}</option>`).join('')}
      </select>
      <span class="mark" id="mark_q${i}"></span>
    </div>
  `;
  testContainer.appendChild(div);
});

/* ---------- ПРОВЕРКА ---------- */
function checkAll() {
  let correctCount = 0;
  let wrongCount = 0;
  let filledCount = 0;

  questions.forEach((q, i) => {
    const sel = document.getElementById('q' + i);
    const mark = document.getElementById('mark_q' + i);

    sel.classList.remove('correct', 'wrong');
    mark.textContent = '';
    mark.className = 'mark';

    if (sel.value === '') return;
    filledCount++;

    // Приводим ответ к нижнему регистру для надежности
    const userAns = sel.value.toLowerCase();
    const correctAns = q.a.toLowerCase();

    if (userAns === correctAns) {
      correctCount++;
      sel.classList.add('correct');
      mark.textContent = '✓';
      mark.classList.add('ok');
    } else {
      wrongCount++;
      sel.classList.add('wrong');
      mark.textContent = '✗';
      mark.classList.add('bad');
    }
  });

  const total = questions.length;
  const result = document.getElementById('result');
  result.style.display = 'block';

  const passed = (filledCount === total) && (wrongCount <= MAX_MISTAKES);

  if (passed) {
    result.className = 'pass';
    const errWord = wrongCount === 0 ? 'ни одной ошибки' : (wrongCount === 1 ? '1 ошибка' : `${wrongCount} ошибки`);
    result.textContent = `Тест сдан! ✅ Правильно: ${correctCount}/${total}, ${errWord} (допускается до ${MAX_MISTAKES}). 🎃👻🦇`;
  } else {
    result.className = 'fail';
    let msg = '';
    if (filledCount < total) {
      msg = `Заполнено ${filledCount} из ${total}. Ответьте на все вопросы. `;
    }
    msg += `Ошибок: ${wrongCount} (допускается не больше ${MAX_MISTAKES}). Исправьте красные поля и проверьте снова. 💀`;
    result.textContent = msg;
  }
}

/* ---------- СБРОС ---------- */
function resetAll() {
  questions.forEach((q, i) => {
    const sel = document.getElementById('q' + i);
    sel.value = '';
    sel.classList.remove('correct', 'wrong');
    const mark = document.getElementById('mark_q' + i);
    mark.textContent = '';
    mark.className = 'mark';
  });
  const result = document.getElementById('result');
  result.style.display = 'none';
  result.textContent = '';
  result.className = '';
}

document.getElementById('checkBtn').addEventListener('click', checkAll);
document.getElementById('resetBtn').addEventListener('click', resetAll);
</script>
</body>
</html>
